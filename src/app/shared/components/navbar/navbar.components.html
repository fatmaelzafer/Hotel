@if(isroom){
<header class="fixed top-0 left-0 w-full z-50   border-none px-4 sm:px-8 lg:px-16 py-4 blur-sm bg-white">
  <div class="flex items-center justify-between max-w-7xl mx-auto">

    <!-- Brand Logo -->
    <a href="#" class="text-xl sm:text-2xl font-bold text-[#023A5D] tracking-wide">
      Nile View Suites
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center gap-x-6 lg:gap-x-8 text-sm lg:text-base text-white font-medium">
      @for(p of pages ; track $index){
        <a [routerLink]="p.link" class="text-[#023A5D] hover:text-zinc-300 transition">{{ p.name}}</a>
      }
    </nav>

    <!-- Desktop Right Actions -->
    <div class="hidden md:flex items-center gap-x-4 text-sm font-medium text-[#023A5D]">
      <a [routerLink]="'/login'" class="hover:text-zinc-300 transition px-2 py-1">Login</a>
      <button class="rounded-full bg-white px-5 py-2 text-black hover:bg-zinc-200 transition shadow-sm cursor-pointer">
        <a [routerLink]="'/signup'" class="hover:text-zinc-300 transition px-2 py-1">Sign up</a>
      </button>
    </div>

    <!-- Mobile Menu Toggle Button (Hamburger) -->
    <button
  (click)="toggleMenu()"
  class="md:hidden text-white p-2 focus:outline-none cursor-pointer"
  aria-label="Toggle Navigation">
  <i class="fa-solid fa-grip-lines"></i>
</button>

  </div>

  <!-- Mobile Dropdown Navigation -->
  <div
  [class.hidden]="!isMenuOpen"
  class="md:hidden border-t border-white/10 mt-4 pt-4 pb-4 flex flex-col gap-y-3 text-white transition-all">

  <a [routerLink]="'/home'"(click)="isMenuOpen = false" class="px-3 py-2 font-medium text-white/90 hover:text-white hover:bg-white/10 rounded-lg transition">Home</a>
  <a [routerLink]="'/rooms'" (click)="isMenuOpen = false" class="px-3 py-2 ont-medium text-white/90 hover:text-white  hover:bg-white/10 rounded-lg transition">Rooms</a>
  <!-- <a href="#" (click)="isMenuOpen = false" class="px-3 py-2 text-white/80 hover:text-white hover:bg-white/10 rounded-lg transition">Offers</a>
  <a href="#" (click)="isMenuOpen = false" class="px-3 py-2 text-white/80 hover:text-white hover:bg-white/10 rounded-lg transition">Contact</a> -->

  <div class="border-t border-white/10 pt-3 mt-1 flex flex-col gap-y-2">
    <a [routerLink]="'/login'" (click)="isMenuOpen = false" class="text-center py-2 text-white/90 hover:text-white font-medium">Login</a>
    <button [routerLink]="'/signup'" (click)="isMenuOpen = false;" class="w-full rounded-full bg-white py-2.5 text-black font-semibold hover:bg-zinc-200 transition cursor-pointer">
      Sign up
    </button>
  </div>
</div>

</header>
}
